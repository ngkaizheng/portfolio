<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate Limited — a mini game | Ng Kai Zheng</title>
    <meta name="description" content="A small arcade game on Ng Kai Zheng's portfolio: you are the API gateway, route requests and dodge the DDoS flood." />
    <meta name="theme-color" content="#050505" />
    <script>
      // Theme before first paint (src/lib/theme.ts owns the toggle).
      try {
        var t = localStorage.getItem('nkz-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="canonical" href="https://ngkaizheng.github.io/portfolio/play/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/play/main.tsx"></script>
  </body>
</html>
